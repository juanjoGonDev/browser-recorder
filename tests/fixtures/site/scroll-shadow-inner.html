<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Scroll in shadow DOM, inner frame</title>
    <script>
      class FrameCard extends HTMLElement {
        connectedCallback() {
          const root = this.attachShadow({ mode: 'open' });
          root.innerHTML =
            '<style>.box{width:150px;height:60px;overflow:auto}.fill{height:700px}</style><div id="framed" class="box"><div class="fill">Framed box</div></div>';
        }
      }
      customElements.define('frame-card', FrameCard);
    </script>
  </head>
  <body>
    <frame-card id="holder"></frame-card>
  </body>
</html>
