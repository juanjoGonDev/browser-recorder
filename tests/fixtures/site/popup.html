<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Popup</title>
  </head>
  <body>
    <a id="open-link" href="popup-target.html" target="_blank"
      >Open in a new tab</a
    >
    <button id="open-script">Open from script</button>
    <script>
      document.getElementById('open-script').addEventListener('click', () => {
        window.open('popup-target.html');
      });
    </script>
  </body>
</html>
