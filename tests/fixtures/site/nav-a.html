<html lang="en">

    <title>Navigation A</title>

  <body>
    <h1>Page A</h1>
    <a id="to-b" href="nav-b.html">Go to B</a>
    <a id="redirect" href="redirect.html">Go through a redirect</a>

        history.pushState({}, '', 'nav-a.html?step=2');
