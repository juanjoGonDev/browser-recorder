name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build, pack, and test without publishing; false publishes to npm
        required: true
        default: true
        type: boolean

run-name: Publish browser-recorder to npm${{ inputs.dry_run && ' (dry run)' || '' }}

permissions: read-all

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate package
    if: >-
      github.repository == 'juanjoGonDev/browser-recorder' &&
      github.event.repository.fork == false &&
      github.actor == github.repository_owner &&
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      version: ${{ steps.manifest.outputs.version }}
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install reproducibly
        run: pnpm install --frozen-lockfile

      - name: Build package
        run: pnpm build

      - name: Validate package metadata
        id: manifest
        run: |
          set -euo pipefail
          package_name=$(node -p "require('./package.json').name")
          package_version=$(node -p "require('./package.json').version")
          if [[ "$package_name" != 'browser-recorder' ]]; then
            echo "::error title=Unexpected npm package name::$package_name"
            exit 1
          fi
          if ! [[ "$package_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error title=Invalid npm package version::$package_version is not stable SemVer"
            exit 1
          fi
          if [[ $(node -p "require('./package.json').private === true") == 'true' ]]; then
            echo '::error title=Private npm package::Remove private=true before publishing.'
            exit 1
          fi
          echo "name=$package_name" >> "$GITHUB_OUTPUT"
          echo "version=$package_version" >> "$GITHUB_OUTPUT"

      - name: Pack and install from a clean external root
        id: package
        run: bash scripts/verify-npm-package.sh

      - name: Reject an already published version
        if: inputs.dry_run != true
        working-directory: ${{ runner.temp }}
        env:
          PACKAGE_NAME: ${{ steps.manifest.outputs.name }}
          PACKAGE_VERSION: ${{ steps.manifest.outputs.version }}
        run: |
          set -euo pipefail
          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version >/dev/null 2>&1; then
            echo "::error title=Version already published::$PACKAGE_NAME@$PACKAGE_VERSION already exists; bump package.json before publishing."
            exit 1
          fi

      - name: Upload validated package for publication
        if: inputs.dry_run != true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-recorder-${{ steps.manifest.outputs.version }}
          path: ${{ steps.package.outputs.tarball }}
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Publish package
    needs: validate
    if: >-
      inputs.dry_run != true &&
      github.repository == 'juanjoGonDev/browser-recorder' &&
      github.event.repository.fork == false &&
      github.actor == github.repository_owner &&
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: admin
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout trusted default commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Download validated package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: browser-recorder-${{ needs.validate.outputs.version }}
          path: ${{ runner.temp }}/npm-package

      - name: Publish package with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
          TARBALL: ${{ runner.temp }}/npm-package/browser-recorder-${{ needs.validate.outputs.version }}.tgz
        run: npm publish "$TARBALL" --access public --provenance
