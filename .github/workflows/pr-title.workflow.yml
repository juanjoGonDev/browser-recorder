name: PR title

# Separate from ci.yml on purpose: a title edit must re-check only the title,
# and ci.yml's cancel-in-progress group would cancel the in-flight OS matrix.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: read-all

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  title:
    name: Commitlint — PR title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.repository == 'juanjoGonDev/browser-recorder'
    permissions:
      contents: read
    steps:
      - name: Checkout candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install reproducibly
        run: pnpm install --frozen-lockfile

      # The title is untrusted input: it reaches the shell only through env.
      - name: Commitlint — PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint --verbose
